name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    # Windows runs the same suite. A test that needs a Linux host carries the linux_host marker and
    # skips there, and tests/conftest.py owns that rule.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install the linux clang runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      # the dev extra, not a bare pytest: addopts asks for 8 workers, which pytest-xdist provides
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # Builds a real consumer against the ReCpp module export, on every compiler family. The checkout
  # IS the mama under test, so no version pinning is needed here.
  module-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  compiler: clang, expect: modules }
          - { os: ubuntu-latest,  compiler: gcc,   expect: headers }  # gcc 13 reports no import graph
          - { os: windows-latest, compiler: windows, expect: any }    # tighten once a run names the path
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install the ReCpp build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdw-dev libunwind-dev ninja-build libc++-dev libc++abi-dev

      - name: Install mama from this checkout
        run: pip install -e .

      # TODO: drop --branch once the consumer test reaches ReCpp master
      - name: Clone the ReCpp consumer fixture
        run: git clone --depth 1 --branch claude/mama-module-cppm-support-03jtvo https://github.com/RedFox20/ReCpp.git ../ReCpp

      - name: Build and run the consumer
        working-directory: ../ReCpp/tests/consumer
        run: python run_test.py --compiler ${{ matrix.compiler }} --expect ${{ matrix.expect }} --compare-paths --jobs 3

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install packaging tools
        run: pip install -U build "twine>=6.1" "packaging>=24.2"

      # setuptools>=77 writes Metadata 2.4 license fields, and twine rejects them when
      # packaging is older than 24.2. Only the upload reports that error, so check it here.
      - name: Build and check distribution metadata
        run: |
          python -m build
          twine check --strict dist/*
