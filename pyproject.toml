[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mama"
dynamic = ["version"]
description = "A modular C++ build tool even your mama can use"
license = "MIT"
authors = [
    { name="Jorma Rebane", email="jorma.rebane@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
keywords=[
    'mama', 'build', 'mamabuild', 'c', 'c++', 'tool', 'cmake', 
    'simple', 'easy', 'package', 'manager', 'cross-platform'
]
dependencies = [
    "distro",
    "keyring",
    "keyrings.cryptfile",
    "termcolor",
    "colorama",
    "python-dateutil",
    "psutil",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent"
]

[project.urls]
"Homepage" = "https://github.com/RedFox20/Mama"
"Bug Tracker" = "https://github.com/RedFox20/Mama/issues"
"Changelog" = "https://github.com/RedFox20/Mama/blob/master/changelog.txt"

[project.scripts]
mama = "mama.main:__main__"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` runs a real toolchain per platform (~90s). Run it before a release:
#     python -m pytest tests/test_platform_configure -m slow
addopts = "-m 'not slow'"
markers = ["slow: needs a real installed toolchain, excluded from the default run",
           "linux_host: needs a Linux host, skipped on Windows and macOS",
           "case_sensitive_fs: deploys two dir names that differ only by case, skipped where the filesystem merges them"]

[tool.setuptools.dynamic]
version = {attr = "mama._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mama*"]
